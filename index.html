<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniTun</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #09090b;
      }
      #root {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .init-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .init-loader .shield {
        width: 40px;
        height: 40px;
        border: 3px solid #34d399;
        border-radius: 8px;
        position: relative;
      }
      .init-loader .shield::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        width: 10px;
        height: 16px;
        border: 2px solid #34d399;
        border-top: none;
        border-radius: 0 0 6px 6px;
      }
      .init-loader .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #27272a;
        border-top-color: #34d399;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .init-loader p {
        margin: 0;
        color: #71717a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="init-loader">
        <div class="shield"></div>
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
