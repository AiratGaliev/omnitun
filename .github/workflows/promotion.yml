name: Promotion

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  dev-to-test:
    if: github.event.pull_request.base.ref == 'test' && github.event.pull_request.head.ref == 'dev'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Prepare Tauri external binary placeholder
        run: npm run prepare:mcp-sidecar:placeholder
      - name: Frontend regression checks
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri host dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev
      - name: Rust format check
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Desktop host and Core tests
        working-directory: src-tauri
        run: cargo test --workspace --locked
      - name: MCP handler and contract tests
        working-directory: src-tauri
        run: cargo test -p omnitun --features mcp-server --lib --locked
      - name: Rust Clippy
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-to-main:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Prepare Tauri external binary placeholder
        run: npm run prepare:mcp-sidecar:placeholder
      - name: Frontend release-readiness checks
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run check:release-metadata
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev
      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust regression suite
        working-directory: src-tauri
        run: cargo test --workspace --locked
      - name: MCP handler and contract regression suite
        working-directory: src-tauri
        run: cargo test -p omnitun --features mcp-server --lib --locked
      - name: Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
