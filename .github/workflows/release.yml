name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: omnitun-x86_64-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: omnitun-x86_64-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      # WiX v3 uses VBScript during MSI linking. Tauri reports a generic
      # "failed to run light.exe" when this Windows optional feature is absent.
      - name: Enable VBScript for WiX MSI bundling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName VBSCRIPT
          if ($feature.State -ne 'Enabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName VBSCRIPT -All -NoRestart
          }

          $feature = Get-WindowsOptionalFeature -Online -FeatureName VBSCRIPT
          if ($feature.State -ne 'Enabled') {
            throw 'Windows optional feature VBSCRIPT is not enabled; WiX MSI bundling cannot continue.'
          }

      - name: Build Tauri application and installers
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundles

      - name: Generate updater.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"

          # Windows signature
          WIN_SIG=""
          WIN_SIG_FILE=$(find bundles -name "*.nsis.zip.sig" | head -1)
          if [ -n "$WIN_SIG_FILE" ]; then
            WIN_SIG=$(cat "$WIN_SIG_FILE")
            WIN_URL="https://github.com/${REPO}/releases/download/${TAG}/$(basename "${WIN_SIG_FILE%.sig}")"
          fi

          # Linux signature
          LINUX_SIG=""
          LINUX_SIG_FILE=$(find bundles -name "*.AppImage.tar.gz.sig" | head -1)
          if [ -n "$LINUX_SIG_FILE" ]; then
            LINUX_SIG=$(cat "$LINUX_SIG_FILE")
            LINUX_URL="https://github.com/${REPO}/releases/download/${TAG}/$(basename "${LINUX_SIG_FILE%.sig}")"
          fi

          jq -n \
            --arg v "$VERSION" \
            --arg date "$DATE" \
            --arg win_url "${WIN_URL:-}" \
            --arg win_sig "${WIN_SIG:-}" \
            --arg linux_url "${LINUX_URL:-}" \
            --arg linux_sig "${LINUX_SIG:-}" \
            '{
              version: $v,
              pub_date: $date,
              platforms: {
                "windows-x86_64": {
                  signature: $win_sig,
                  url: $win_url
                },
                "linux-x86_64": {
                  signature: $linux_sig,
                  url: $linux_url
                }
              }
            }' > bundles/updater.json

          echo "updater.json generated for version $VERSION"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: bundles/**/*
          generate_release_notes: true
          draft: true
