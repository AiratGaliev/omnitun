[package]
name = "omnitun"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "omnitun"

[features]
default = ["tauri"]
tauri = []
mcp-server = ["dep:rmcp", "dep:tokio-stream", "dep:dirs"]

[lib]
name = "omnitun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mcp_server"
path = "src/bin/mcp_server.rs"
required-features = ["mcp-server"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
winresource = "0.1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.5.1"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "socks"], default-features = false }
zip = "2"
tar = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
chrono = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "net", "time", "signal"] }
async-trait = "0.1"
base64 = "0.22"
anyhow = "1"
url = "2"
maxminddb = "0.24"
moka = { version = "0.12", features = ["future"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-log = "0.2"

# MCP server (optional, enabled via --features mcp-server)
rmcp = { version = "2.1.0", optional = true, features = ["server", "transport-io"] }
tokio-stream = { version = "0.1", optional = true }
dirs = { version = "5", optional = true }
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
which = "6"

